[project]
name = "tiktokexport"
version = "0.1.0"
description = "Export TikTok videos into Obsidian-friendly Markdown notes with local Whisper transcription."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "yt-dlp>=2024.12.0",
    "openai-whisper>=20240930",
    "imageio-ffmpeg>=0.5.1",
    "platformdirs>=4.2.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
tiktokexport = "tiktokexport.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
